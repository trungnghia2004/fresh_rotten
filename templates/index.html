<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh&Rotten</title>
    <link rel="stylesheet" href="/static/style.css?v=5" />
  </head>
  <body>
    <main class="wrap">
      <section class="app-layout">
        <aside class="card control-panel">
          <h1>Fresh&Rotten</h1>
          <p>Tải ảnh hoặc mở camera để nhận diện chất lượng trái cây.</p>

          <div class="mode-switch">
            <label><input type="radio" name="uploadMode" value="image" checked /> Ảnh</label>
            <label><input type="radio" name="uploadMode" value="camera" /> Camera</label>
          </div>

          <input id="fileInput" type="file" accept="image/*" />
          <button id="predictBtn">Dự đoán</button>
          <button id="rawCamBtn" type="button" class="secondary hidden">Test Camera Gốc</button>

          <div id="inputHint" class="hint">Đang ở chế độ ảnh.</div>
          <div id="globalResult" class="result empty">Chưa có kết quả. Hãy chọn tệp và bấm Dự đoán.</div>

          <div class="model-result" id="outResult">
            <div>Số lượng: <strong id="outCounts">tươi 0 / hỏng 0 (crops 0)</strong></div>
          </div>
        </aside>

        <section class="grid media-panel">
          <article class="card" id="inputCard">
            <h2>Input</h2>
            <div class="preview-wrap">
              <img id="inputImage" class="preview hidden" alt="Input image" />
              <video id="inputVideo" class="preview hidden" controls></video>
            </div>
          </article>

          <article class="card">
            <h2>Output</h2>
            <p>Ảnh/camera kèm box và nhãn.</p>

            <div class="preview-wrap">
              <img id="outputImage" class="preview hidden" alt="Output image" />
              <video id="outputVideo" class="preview hidden" controls playsinline type="video/mp4"></video>
              <img id="outputStream" class="preview hidden" alt="Streaming output" />
              <video id="outputCamVideo" class="preview hidden" autoplay playsinline muted></video>
              <canvas id="outputCamOverlay" class="overlay-canvas hidden"></canvas>
            </div>
          </article>
        </section>
      </section>
    </main>

    <script src="/static/app.js?v=32"></script>
  </body>
</html>
